name: Test PuckPedia Playwright

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test-puckpedia:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test PuckPedia through Chromium
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright


          URLS = [
              "https://puckpedia.com/teams",
              "https://puckpedia.com/e/teams",
          ]


          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )

              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/138.0.0.0 Safari/537.36"
                  ),
                  viewport={
                      "width": 1920,
                      "height": 1080,
                  },
                  locale="en-US",
                  timezone_id="America/New_York",
              )

              page = context.new_page()

              for url in URLS:

                  print("")
                  print("=" * 70)
                  print(f"Testing: {url}")
                  print("=" * 70)

                  try:

                      response = page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=60000,
                      )

                      if response:
                          print(
                              f"Initial HTTP status: "
                              f"{response.status}"
                          )

                      print(
                          f"Initial title: {page.title()}"
                      )

                      # Give Cloudflare's browser challenge
                      # time to execute if one is presented.
                      for seconds in range(0, 31, 5):

                          if seconds > 0:
                              time.sleep(5)

                          title = page.title()

                          print("")
                          print(
                              f"After {seconds:02d}s:"
                          )
                          print(
                              f"  URL: {page.url}"
                          )
                          print(
                              f"  Title: {title}"
                          )

                          html = page.content()

                          print(
                              f"  HTML length: "
                              f"{len(html):,}"
                          )

                          teams_table = page.locator(
                              "table.pp_table-teams"
                          ).count()

                          print(
                              f"  Team tables found: "
                              f"{teams_table}"
                          )

                          if teams_table > 0:

                              print("")
                              print(
                                  "SUCCESS: PuckPedia team "
                                  "table became available."
                              )

                              break

                      else:

                          print("")
                          print(
                              "FAILED: Team table did not "
                              "become available after 30 seconds."
                          )

                          print("")
                          print("Page preview:")

                          text = page.locator(
                              "body"
                          ).inner_text()

                          print(text[:2000])

                  except Exception as e:

                      print("")
                      print(
                          f"ERROR: "
                          f"{type(e).__name__}: {e}"
                      )

              context.close()
              browser.close()

          PY
name: Refresh Organisation Detail LLM

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-organisation-detail-llm:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Generate Organisation LLM Summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: pacey32-agency
          PROMPT_VERSION: "1.0"
          FORCE_REFRESH: "false"
        run: python organisation/orgdetail_llm.py
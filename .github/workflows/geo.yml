name: Refresh Geo Data

on:
  workflow_dispatch:
    inputs:

      run_arena:
        description: "Refresh Arena table"
        type: boolean
        required: true
        default: true

      run_practice:
        description: "Refresh Practice Facility table"
        type: boolean
        required: true
        default: true

      run_poi:
        description: "Refresh POI tables"
        type: boolean
        required: true
        default: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-geo:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Refresh Arena
        if: ${{ inputs.run_arena }}
        env:
          GCP_PROJECT: pacey32-agency
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          python -m geospatial.geo_arena

      - name: Refresh Practice Facility
        if: ${{ inputs.run_practice }}
        env:
          GCP_PROJECT: pacey32-agency
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          python -m geospatial.geo_practice_facility

      - name: Refresh POI Tables
        if: ${{ inputs.run_poi }}
        env:
          GCP_PROJECT: pacey32-agency
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          python -m geospatial.geo_poi
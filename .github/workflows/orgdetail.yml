name: Refresh Organisation Details

on:
  workflow_dispatch:

  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-organisation-details:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            requests \
            beautifulsoup4 \
            lxml \
            html5lib \
            google-cloud-bigquery \
            db-dtypes \
            pyarrow

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run Organisation Detail refresh
        run: |
          python organisation/orgdetail.py
name: Refresh AHL Logos

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  refresh-ahl-logos:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Refresh AHL Logos
        env:
          GCP_PROJECT: pacey32-agency
        run: python -u ahllogos/ahl_logos.py

      - name: Commit updated AHL logo files
        run: |
          if git diff --quiet -- app/public/ahl-logos/; then
            echo "No AHL logo file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/public/ahl-logos/
          git commit -m "Refresh AHL logos"
          git push
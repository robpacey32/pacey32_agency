name: Refresh Tax Data

on:
  workflow_dispatch:
    inputs:
      run_city_tax:
        description: "Run city tax pipeline (tax.py)"
        required: false
        type: boolean
        default: true

      run_tax_brackets:
        description: "Run tax bracket pipeline (tax_bracket.py)"
        required: false
        type: boolean
        default: false

  schedule:
    # Monthly: city tax refresh check
    - cron: "20 5 1 * *"

    # Annual: tax brackets
    - cron: "0 6 1 1 *"

permissions:
  contents: read
  id-token: write

jobs:
  refresh-tax:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ======================================================
      # CITY TAX
      # ======================================================

      - name: Run city tax pipeline
        if: ${{ inputs.run_city_tax || (github.event_name == 'schedule' && github.event.schedule == '20 5 1 * *') }}
        env:
          GCP_PROJECT: pacey32-agency
          TEAM_TABLE: pacey32-agency.Team.TeamList
          TAX_TABLE: pacey32-agency.City.city_tax
          REFRESH_MONTHS: "3"
          HTTP_USER_AGENT: pacey32-agency-city-tax/1.0
        run: python tax/tax.py

      # ======================================================
      # TAX BRACKETS
      # ======================================================

      - name: Run tax bracket pipeline
        if: ${{ inputs.run_tax_brackets || (github.event_name == 'schedule' && github.event.schedule == '0 6 1 1 *') }}
        env:
          GCP_PROJECT: pacey32-agency
          TAX_BRACKET_TABLE: pacey32-agency.City.tax_brackets
          TAX_YEAR: "2026"
          HTTP_USER_AGENT: pacey32-agency-tax-brackets/1.0
        run: python tax/tax_bracket.py
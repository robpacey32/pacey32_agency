name: Refresh Team Travel Data

on:
  workflow_dispatch:
    inputs:

      run_current:
        description: "Build Current Season Travel Tables"
        type: boolean
        default: true

      run_5yr:
        description: "Build 5 Year Travel Tables"
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-travel:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      #########################################################
      # CURRENT SEASON
      #########################################################

      - name: Build Travel_1_ScheduleExpanded
        if: ${{ inputs.run_current }}
        env:
          GCP_PROJECT: pacey32-agency

          SCHEDULE_TABLE: nhl-pacey32-github.NHL_Views.Schedule
          TEAM_TABLE: pacey32-agency.Team.TeamList
          CITY_REFERENCE_TABLE: pacey32-agency.City.CityReference

          DESTINATION_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded

          REGULAR_SEASON_GAME_TYPE: "2"

          EXPECTED_TEAM_COUNT: "32"
          EXPECTED_GAMES_PER_TEAM: "82"

          STRICT_GAME_COUNT_VALIDATION: "false"

        run: python distancetravelled/1_ScheduleExpanded.py

      - name: Build Travel_2_Legs
        if: ${{ inputs.run_current }}
        env:
          GCP_PROJECT: pacey32-agency

          SOURCE_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded
          DESTINATION_TABLE: pacey32-agency.Team.Travel_2_Legs

        run: python distancetravelled/2_TravelLegs.py

      #########################################################
      # FIVE YEAR
      #########################################################

      - name: Build Travel_1_ScheduleExpanded_5yr
        if: ${{ inputs.run_5yr }}
        env:
          GCP_PROJECT: pacey32-agency

          SCHEDULE_TABLE: nhl-pacey32-github.NHL_Views.Schedule
          TEAM_TABLE: pacey32-agency.Team.TeamList_History
          CITY_REFERENCE_TABLE: pacey32-agency.City.CityReference

          DESTINATION_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded_5yr

          REGULAR_SEASON_GAME_TYPE: "2"
          SEASONS_TO_INCLUDE: "5"

          EXPECTED_TEAM_COUNT: "160"
          EXPECTED_GAMES_PER_TEAM: "82"

          STRICT_GAME_COUNT_VALIDATION: "true"

        run: python distancetravelled/1b_ScheduleExpanded_5yr.py

      - name: Build Travel_2_Legs_5yr
        if: ${{ inputs.run_5yr }}
        env:
          GCP_PROJECT: pacey32-agency

          SOURCE_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded_5yr
          DESTINATION_TABLE: pacey32-agency.Team.Travel_2_Legs_5yr

        run: python distancetravelled/2_TravelLegs.py
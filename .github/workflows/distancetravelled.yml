name: Refresh Team Travel Data

on:
  workflow_dispatch:
    inputs:
      run_stage_1:
        description: "Build Travel_1_ScheduleExpanded"
        type: boolean
        default: true

      run_stage_2:
        description: "Build Travel_2_Legs"
        type: boolean
        default: true

      run_stage_3:
        description: "Build Travel_3_Summary"
        type: boolean
        default: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-travel:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      #########################################################
      # Stage 1
      #########################################################

      - name: Build Travel_1_ScheduleExpanded
        if: ${{ inputs.run_stage_1 }}
        env:
          GCP_PROJECT: pacey32-agency

          SCHEDULE_TABLE: nhl-pacey32-github.NHL_Views.Schedule
          TEAM_TABLE: pacey32-agency.Team.TeamList
          CITY_REFERENCE_TABLE: pacey32-agency.City.CityReference

          DESTINATION_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded

          REGULAR_SEASON_GAME_TYPE: "2"

          EXPECTED_TEAM_COUNT: "32"
          EXPECTED_GAMES_PER_TEAM: "82"

          STRICT_GAME_COUNT_VALIDATION: "false"

        run: python distancetravelled/1_ScheduleExpanded.py

      #########################################################
      # Stage 2
      #########################################################

      - name: Build Travel_2_Legs
        if: ${{ inputs.run_stage_2 }}
        env:
          GCP_PROJECT: pacey32-agency
          SOURCE_TABLE: pacey32-agency.Team.Travel_1_ScheduleExpanded
          DESTINATION_TABLE: pacey32-agency.Team.Travel_2_Legs

        run: python distancetravelled/2_TravelLegs.py

      #########################################################
      # Stage 3
      #########################################################

      - name: Build Travel_3_Summary
        if: ${{ inputs.run_stage_3 }}
        env:
          GCP_PROJECT: pacey32-agency
          SOURCE_TABLE: pacey32-agency.Team.Travel_2_Legs
          DESTINATION_TABLE: pacey32-agency.Team.Travel_3_Summary

        run: python distancetravelled/3_summary.py
name: Refresh Cap Data

on:
  workflow_dispatch:
    inputs:

      run_team:
        description: "Refresh Team cap table"
        type: boolean
        required: true
        default: true

      run_player:
        description: "Refresh Player cap table"
        type: boolean
        required: true
        default: true

      run_player_detail:
        description: "Refresh Player detail table"
        type: boolean
        required: true
        default: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-cap:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Refresh Team Cap
        if: ${{ inputs.run_team }}
        env:
          GCP_PROJECT: pacey32-agency
        run: |
          python -m cap.teamcap

      - name: Refresh Player Cap
        if: ${{ inputs.run_player }}
        env:
          GCP_PROJECT: pacey32-agency
        run: |
          python -m cap.playercap

      - name: Refresh Player Detail
        if: ${{ inputs.run_player_detail }}
        env:
          GCP_PROJECT: pacey32-agency
        run: |
          python -m cap.playercapdetail
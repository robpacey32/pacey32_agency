name: Refresh Player Residential Areas

on:
  workflow_dispatch:
    inputs:

      force_refresh:
        description: "Regenerate all teams"
        type: boolean
        required: true
        default: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-player-residential-areas:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            pyarrow \
            requests \
            geopy \
            google-cloud-bigquery \
            google-cloud-bigquery-storage \
            db-dtypes \
            google-genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Refresh Player Residential Areas
        env:
          GCP_PROJECT: pacey32-agency
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          python -m geospatial.geo_playerresidence

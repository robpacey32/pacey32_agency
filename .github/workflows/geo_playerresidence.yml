name: Refresh Player Residential Areas

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force regeneration for all NHL teams"
        required: true
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh-player-residential-areas:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Refresh Player Residential Areas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh }}
        run: |
          python -m geospatial.geo_playerresidence